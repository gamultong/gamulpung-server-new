[project]
name = "gamulpung-server"
version = "0.1.0"
description = "Gamulpung Server - 온라인 지뢰찾기 게임 서버"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core web framework
    "fastapi==0.120.1",
    "uvicorn==0.38.0",
    "starlette==0.49.0",
    # WebSocket support
    "websockets==15.0.1",
    # Database
    "aiosqlite==0.21.0",
    # Configuration and environment
    "python-dotenv==1.2.1",
    "dodoenv==0.1.0",
    # Logging and monitoring
    "loguru==0.7.3",
    "sentry-sdk==2.44.0",
    # Data validation
    "pydantic==2.12.3",
    "pydantic_core==2.41.4",
    "annotated-types==0.7.0",
    "annotated-doc==0.0.3",
    # HTTP client and tools
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "httptools==0.7.1",
    "h11==0.16.0",
    # Utilities
    "click==8.3.0",
    "anyio==4.11.0",
    "sniffio==1.3.1",
    "certifi==2025.10.5",
    "idna==3.11",
    "urllib3==2.5.0",
    "PyYAML==6.0.3",
    # Type checking and inspection
    "typing_extensions==4.15.0",
    "typing-inspection==0.4.2",
    # Git support
    "GitPython==3.1.41",
    "gitdb==4.0.12",
    "smmap==5.0.2",
    # Custom packages
    "gamlset==0.1.2",
    # Performance and profiling tools
    "uvloop==0.22.1 ; platform_system != 'Windows'",
    "watchfiles==1.1.1",
    "cloudpickle==3.1.2",
    "psutil==7.1.3",
    "nvidia-ml-py==13.580.82",
    "numpy==2.3.5",
    # Rich output and formatting
    "rich==14.2.0",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.3",
    "markdown-it-py==4.0.0",
    "mdurl==0.1.2",
    "Pygments==2.19.2",
    "tornado==6.5.2",
    # Build tools
    "setuptools==78.1.1",
]

[project.optional-dependencies]
dev = [
    "freezegun==1.5.5",
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
    "pyinstrument==5.1.1",
    "scalene==1.5.55",
    "snakeviz==2.2.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "data", "handler", "receiver"]
