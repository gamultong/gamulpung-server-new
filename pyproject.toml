[project]
name = "gamulpung-server"
version = "0.1.0"
description = "Gamulpung Server - 온라인 지뢰찾기 게임 서버"
readme = "README.md"
requires-python = ">=3.11"
# 직접 import하는 패키지만 선언한다. 전이 의존성은 uv.lock이 고정한다.
dependencies = [
    # Web framework / server
    "fastapi==0.120.1",
    "uvicorn==0.38.0",
    "uvloop==0.22.1 ; platform_system != 'Windows'",
    # WebSocket
    "websockets==15.0.1",
    # Database
    "aiosqlite==0.21.0",
    # Configuration
    "dodoenv==0.1.0",
    # Logging / monitoring
    "loguru==0.7.3",
    "sentry-sdk==2.44.0",
    "prometheus-client>=0.20.0",
    # Typing (dataclass_transform, 3.11 호환)
    "typing_extensions==4.15.0",
]

[dependency-groups]
dev = [
    # Testing
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "freezegun==1.5.5",
    # fastapi TestClient 의존 (tests/utils/internal/conn_mock.py)
    "httpx==0.28.1",
    "starlette==0.49.0",
    # Lint
    "ruff>=0.8",
    # Profiling (make profile)
    "psutil==7.1.3",
    "pyinstrument==5.1.1",
    "scalene==1.5.55",
    "snakeviz==2.2.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "data", "handler", "receiver"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["labs", "hr", "bin"]

[tool.ruff.lint]
# F: pyflakes(미사용 import·변수 등), E/W: pycodestyle 핵심, A: builtin 가리기
select = ["F", "E4", "E7", "E9", "W6"]

[tool.ruff.lint.per-file-ignores]
# __init__.py의 미사용 import는 명시적 re-export 패턴(RFC-003)이므로 허용
"__init__.py" = ["F401"]
