name: CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # :latest 명시(배포 스크립트와 동일하게)
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPONAME }}:latest

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only deploy script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/deploy.sh
          sparse-checkout-cone: true


      - name: executing remote ssh commands
        uses: appleboy/ssh-action@v1.0.3   # master 지양, 버전 고정
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME || 'root' }}  # 실제 접속 성공 계정으로
          key: ${{ secrets.KEY }}                     # act에 -s KEY=@... 로 주입
          port: ${{ secrets.PORT || 22 }}
          # 배포 스크립트에 필요한 값 전달(원격 환경변수로 사용)
          envs: DOCKER_USERNAME,DOCKER_REPONAME
          script_path: tools/deploy.sh
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_REPONAME: ${{ secrets.DOCKER_REPONAME }}
