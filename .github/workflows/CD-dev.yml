name: CD-dev

on:
  push:
    branches: ["develop"]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: setup-env
        uses: ./.github/actions/setup-env
        with:
          dotenv: ${{ secrets.DOTENV }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPONAME }}:dev

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout only deploy script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/deploy.sh
          sparse-checkout-cone: true

      - name: executing remote ssh commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DOCKER_USERNAME,DOCKER_REPONAME,DOCKER_TAG,ENVIRONMENT,CONTAINER_NAME,CONTAINER_PORT_MAPPING
          script_path: tools/deploy.sh
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_REPONAME: ${{ secrets.DOCKER_REPONAME }}
          DOCKER_TAG: dev
          ENVIRONMENT: dev
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
          CONTAINER_PORT_MAPPING: ${{ secrets.CONTAINER_PORT_MAPPING }}
