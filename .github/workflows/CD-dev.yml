  name: CD-dev

  on:
    push:
      branches: ["develop"]

  jobs:
    build-and-push-image:
      runs-on: ubuntu-latest
      environment: development
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: setup-env
          uses: ./.github/actions/setup-env
          with:
            dotenv: ${{ secrets.DOTENV }}

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build and push
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPONAME }}:dev

    deploy:
      needs: build-and-push-image
      runs-on: ubuntu-latest
      environment: development
      steps:
        - name: Checkout only deploy script
          uses: actions/checkout@v4
          with:
            sparse-checkout: |
              tools/deploy.sh
            sparse-checkout-cone: true

        - name: Setup env file
          uses: ./.github/actions/setup-env
          with:
            dotenv: ${{ secrets.DOTENV }}

        - name: Setup tunnel & deploy
          env:
            CLOUDFLARE_TUNNEL_HOSTNAME: ${{ secrets.CLOUDFLARE_TUNNEL_HOSTNAME }}
            CF_ACCESS_CLIENT_ID:        ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF_ACCESS_CLIENT_SECRET:    ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
            SSH_USERNAME:               ${{ secrets.SSH_USERNAME }}
            SSH_KEY_B64:                ${{ secrets.SSH_KEY_B64 }}
            DOCKER_USERNAME:            ${{ secrets.DOCKER_USERNAME }}
            DOCKER_REPONAME:            ${{ secrets.DOCKER_REPONAME }}
            CONTAINER_NAME:             ${{ secrets.CONTAINER_NAME }}
            CONTAINER_PORT_MAPPING:     ${{ secrets.CONTAINER_PORT_MAPPING }}
          run: |
            set -euo pipefail

            echo "CLOUDFLARE_TUNNEL_HOSTNAME=${CLOUDFLARE_TUNNEL_HOSTNAME:-<empty>}"
            echo "CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID:-<empty>}"
            echo "CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET:-<empty>}"

            curl -L --output cloudflared.deb \
              https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
            sudo dpkg -i cloudflared.deb

            cloudflared access tcp \
              --hostname "${CLOUDFLARE_TUNNEL_HOSTNAME}" \
              --url localhost:2222 \
              --service-token-id "${CF_ACCESS_CLIENT_ID}" \
              --service-token-secret "${CF_ACCESS_CLIENT_SECRET}" &
            TUNNEL_PID=$!
            trap 'kill "${TUNNEL_PID}" 2>/dev/null || true' EXIT

            sleep 5

            # SSH 키 복원 (dev.env 에 base64 로 들어있음) :contentReference[oaicite:0]{index=0}
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa

            # deploy.sh 복사
            scp -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -P 2222 \
                tools/deploy.sh \
                "${SSH_USERNAME}@localhost:~/deploy.sh"

            # .env 복사
            scp -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -P 2222 \
                .env \
                "${SSH_USERNAME}@localhost:~/.env"

            # 원격에서 실행
            ssh -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -p 2222 \
                "${SSH_USERNAME}@localhost" \
                "DOCKER_TAG='dev' \
                ENVIRONMENT='dev' \
                DOCKER_USERNAME='${DOCKER_USERNAME}' \
                DOCKER_REPONAME='${DOCKER_REPONAME}' \
                CONTAINER_NAME='${CONTAINER_NAME}' \
                CONTAINER_PORT_MAPPING='${CONTAINER_PORT_MAPPING}' \
                bash ~/deploy.sh"