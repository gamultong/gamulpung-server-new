name: CD-prod

on:
  push:
    tags: ["v*.*.*"]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      docker_tag: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag is on main branch
        run: |
          if [ -n "${ACT:-}" ]; then
            echo "⚠️  Running in act (local), skipping main branch verification"
            exit 0
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "❌ ERROR: Tag must be created from main branch"
            exit 1
          fi

      - name: Extract version from tag
        id: extract-version
        run: |
          VERSION=${{ github.ref_name }}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: ./.github/actions/build-and-push
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
          docker_reponame: ${{ secrets.DOCKER_REPONAME }}
          docker_tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPONAME }}:latest,${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPONAME }}:${{ steps.extract-version.outputs.version }}

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/deploy

      - name: Setup env file
        uses: ./.github/actions/setup-env
        with:
          dotenv: ${{ secrets.DOTENV }}

      - name: Deploy to server
        env:
          CLOUDFLARE_TUNNEL_HOSTNAME: ${{ secrets.CLOUDFLARE_TUNNEL_HOSTNAME }}
          CF_ACCESS_CLIENT_ID:        ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET:    ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SSH_USERNAME:               ${{ secrets.SSH_USERNAME }}
          SSH_KEY_B64:                ${{ secrets.SSH_KEY_B64 }}
          DOCKER_USERNAME:            ${{ secrets.DOCKER_USERNAME }}
          DOCKER_REPONAME:            ${{ secrets.DOCKER_REPONAME }}
          DOCKER_TAG:                 ${{ needs.build-and-push-image.outputs.docker_tag }}
          ENVIRONMENT:                prod
          CONTAINER_NAME:             ${{ secrets.CONTAINER_NAME }}
          CONTAINER_PORT_MAPPING:     ${{ secrets.CONTAINER_PORT_MAPPING }}
          CONTAINER_MEMORY_LIMIT:     ${{ secrets.CONTAINER_MEMORY_LIMIT }}
        run: bash scripts/deploy/main.sh
