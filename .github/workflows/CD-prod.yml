name: CD-prod

on:
  push:
    tags: ["v*.*.*"]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      docker_tag: ${{ steps.docker-tags.outputs.docker_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag is on main branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "❌ ERROR: Tag must be created from main branch"
            exit 1
          fi

      - name: setup-env
        uses: ./.github/actions/setup-env
        with:
          dotenv: ${{ secrets.DOTENV }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker tags
        id: docker-tags
        run: |
          VERSION=${{ github.ref_name }}
          TAGS="${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPONAME }}:latest,${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPONAME }}:${VERSION}"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "docker_tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout only deploy script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/deploy.sh
          sparse-checkout-cone: true

      - name: executing remote ssh commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DOCKER_USERNAME,DOCKER_REPONAME,DOCKER_TAG,ENVIRONMENT,CONTAINER_NAME,CONTAINER_PORT_MAPPING
          script_path: tools/deploy.sh
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_REPONAME: ${{ secrets.DOCKER_REPONAME }}
          DOCKER_TAG: ${{ needs.build-and-push-image.outputs.docker_tag }}
          ENVIRONMENT: prod
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
          CONTAINER_PORT_MAPPING: ${{ secrets.CONTAINER_PORT_MAPPING }}
