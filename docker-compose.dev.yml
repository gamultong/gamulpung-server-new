services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
      - source: grafana_dashboards_config
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: grafana_dashboard_lifecycle
        target: /var/lib/grafana/dashboards/lifecycle.json
    volumes:
      - grafana-data:/var/lib/grafana

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: 'gamulpung-server'
          static_configs:
            - targets: ['host.docker.internal:8000']
          metrics_path: '/metrics'

  grafana_datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: true

  grafana_dashboards_config:
    content: |
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards

  grafana_dashboard_lifecycle:
    content: |
      {
        "annotations": { "list": [] },
        "editable": true,
        "fiscalYearStartMonth": 0,
        "graphTooltip": 0,
        "id": null,
        "links": [],
        "panels": [
          {
            "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
            "fieldConfig": {
              "defaults": { "color": { "mode": "palette-classic" }, "mappings": [], "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } },
              "overrides": []
            },
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
            "id": 1,
            "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
            "pluginVersion": "10.0.0",
            "targets": [{ "datasource": { "type": "prometheus" }, "expr": "sum(lifecycle_rlife_total)", "refId": "A" }],
            "title": "RLife Total Calls",
            "type": "stat"
          },
          {
            "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
            "fieldConfig": {
              "defaults": { "color": { "mode": "palette-classic" }, "mappings": [], "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } },
              "overrides": []
            },
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
            "id": 2,
            "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
            "pluginVersion": "10.0.0",
            "targets": [{ "datasource": { "type": "prometheus" }, "expr": "sum(lifecycle_hlife_total)", "refId": "A" }],
            "title": "HLife Total Calls",
            "type": "stat"
          },
          {
            "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
            "fieldConfig": {
              "defaults": { "color": { "mode": "palette-classic" }, "custom": { "axisBorderShow": false, "axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 10, "gradientMode": "none", "hideFrom": { "legend": false, "tooltip": false, "viz": false }, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": { "type": "linear" }, "showPoints": "auto", "spanNulls": false, "stacking": { "group": "A", "mode": "none" }, "thresholdsStyle": { "mode": "off" } }, "mappings": [], "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }, "unit": "short" },
              "overrides": []
            },
            "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
            "id": 3,
            "options": { "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "single", "sort": "none" } },
            "pluginVersion": "10.0.0",
            "targets": [{ "datasource": { "type": "prometheus" }, "expr": "sum by (event) (rate(lifecycle_rlife_total[1m]))", "legendFormat": "{{event}}", "refId": "A" }],
            "title": "RLife Calls per Minute (by Event)",
            "type": "timeseries"
          },
          {
            "datasource": { "type": "prometheus", "uid": "PBFA97CFB590B2093" },
            "fieldConfig": {
              "defaults": { "color": { "mode": "palette-classic" }, "custom": { "axisBorderShow": false, "axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 10, "gradientMode": "none", "hideFrom": { "legend": false, "tooltip": false, "viz": false }, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "scaleDistribution": { "type": "linear" }, "showPoints": "auto", "spanNulls": false, "stacking": { "group": "A", "mode": "none" }, "thresholdsStyle": { "mode": "off" } }, "mappings": [], "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }, "unit": "s" },
              "overrides": []
            },
            "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
            "id": 4,
            "options": { "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "single", "sort": "none" } },
            "pluginVersion": "10.0.0",
            "targets": [{ "datasource": { "type": "prometheus" }, "expr": "histogram_quantile(0.95, sum by (le, handler) (rate(lifecycle_hlife_duration_seconds_bucket[5m])))", "legendFormat": "{{handler}}", "refId": "A" }],
            "title": "HLife p95 Latency (by Handler)",
            "type": "timeseries"
          }
        ],
        "refresh": "5s",
        "schemaVersion": 38,
        "tags": ["lifecycle"],
        "templating": { "list": [] },
        "time": { "from": "now-15m", "to": "now" },
        "timepicker": {},
        "timezone": "",
        "title": "LifeCycle Metrics",
        "uid": "lifecycle-metrics",
        "version": 1,
        "weekStart": ""
      }

volumes:
  grafana-data:
